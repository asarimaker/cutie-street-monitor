name: CUTIE STREET Monitor

on:
  schedule:
    - cron: "25,55 * * * *"
      timezone: "Asia/Tokyo"
    - cron: "3 7 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutie-street-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect and merge posts
        id: collect
        continue-on-error: true
        env:
          DAILY_MODE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '3 7 * * *' }}
        run: python monitor.py

      - name: Upload failed-page diagnostics
        if: steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: x-page-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit changed monitoring data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/monitor_state.json data/latest.json
          git diff --cached --quiet || git commit -m "Update CUTIE STREET monitoring data"
          git push

      - name: Mark failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
